# Container backend config for input mode "olv2" — mounted at /app/backend.toml
# by containers/compose.yaml when scripts/run_all.sh --input olv2 is used
# (normative schema: include/olv/config.hpp; annotated defaults:
# config/backend.toml). Only the published host ports change with
# run_all.sh's --*-port flags; these container-side ports stay fixed.

[network]
udp_bind = "0.0.0.0"
udp_port = 47000
ws_bind = "0.0.0.0"
ws_port = 8765

[broadcast]
hz = 1.0

[state]
expiry_seconds = 15

[input]
mode = "olv2"
# OLV2 per-track batched updates (docs/PROTOCOL_OLV2.md) on their own port.
olv2_bind = "0.0.0.0"
olv2_port = 47002

[logging]
file = "/tmp/olv_backend.log"
level = "info"
stderr = true
