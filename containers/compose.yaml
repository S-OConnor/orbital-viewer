# compose.yaml — run backend + frontend (+ simulator with --profile sim).
#
# Usage (from the repo root, after scripts/build_all.sh):
#   podman compose -f containers/compose.yaml up                  # no simulator
#   podman compose -f containers/compose.yaml --profile sim up    # with simulator
#   # or the wrapper, which also waits for readiness and tears down on Ctrl-C:
#   scripts/run_all.sh [--sim]
#
# Then open http://localhost:8000/ in a browser. The frontend's default
# Settings -> WS host/port already points at localhost:8765, which is
# published by the backend service below, so no configuration is needed.
#
# Published host ports can be overridden without touching the containers'
# internal ports (which stay 8765/47000/80) via environment variables:
#   OLV_WS_PORT (default 8765), OLV_UDP_PORT (default 47000),
#   OLV_HTTP_PORT (default 8000). scripts/run_all.sh sets these from its
#   --ws-port / --udp-port / --http-port flags.
#
# Images: backend and simulator are NOT built by compose. They are the
# runtime images produced by the build pipeline (scripts/build_all.sh, or
# build_builder.sh -> build.sh -> test.sh -> package.sh), referenced by name:
#   OLV_BACKEND_IMAGE (default localhost/olv-backend:latest)
#   OLV_SIM_IMAGE     (default localhost/olv-sim:latest)
# Set these to registry images to run prebuilt releases. Only the frontend
# (static files, nothing compiled) is built here, from the repo root.
#
# Simulator: behind the "sim" profile, so a plain `up` runs backend + frontend
# only and waits for real input. Add `--profile sim` (scripts/run_all.sh --sim)
# to also replay the example mission into the backend.
#
# Input mode: OLV_INPUT (olv1 | dis | olv2, default olv1) picks the config
# pair under containers/config/<mode>/ that is mounted into the backend and
# simulator, and OLV_UDP_CONTAINER_PORT must be that mode's backend listen
# port (olv1 47000, dis 47001, olv2 47002 — docs/PROTOCOL_UDP.md,
# PROTOCOL_DIS.md, PROTOCOL_OLV2.md). scripts/run_all.sh --input <mode> sets
# both; OLV_UDP_PORT then defaults to the same port on the host.
#
# Networking: compose creates an internal network for these services by
# default; the simulator reaches the backend by its service name ("backend")
# on that internal network — no host networking or port mapping is needed
# between simulator and backend, only backend<->host and frontend<->host are
# published below.
#
# Air-gap: all images must be built (or already present) locally first — see
# containers/Dockerfile.builder, Dockerfile.backend, Dockerfile.simulator and
# Containerfile.frontend for their base-image/mirror notes. No
# service reaches the internet at runtime.

services:
  backend:
    image: ${OLV_BACKEND_IMAGE:-localhost/olv-backend:latest}
    ports:
      - "${OLV_WS_PORT:-8765}:8765"
      - "${OLV_UDP_PORT:-47000}:${OLV_UDP_CONTAINER_PORT:-47000}/udp"
    # Per-mode config (see "Input mode" above). label=disable lets the
    # container read the bind mount on SELinux hosts without relabeling the
    # checkout, as scripts/_common.sh does for the builder.
    volumes:
      - ./config/${OLV_INPUT:-olv1}/backend.toml:/app/backend.toml:ro
    security_opt:
      - label=disable
    command: ["--config", "/app/backend.toml"]
    networks:
      - olv-net

  frontend:
    build:
      context: ..
      dockerfile: containers/Containerfile.frontend
    ports:
      - "${OLV_HTTP_PORT:-8000}:80"
    networks:
      - olv-net

  simulator:
    image: ${OLV_SIM_IMAGE:-localhost/olv-sim:latest}
    profiles: ["sim"]
    depends_on:
      - backend
    # Replay the bundled example mission on loop (the CSV is baked into the
    # image at /app/data) in the selected input mode's wire protocol. The
    # simulator tolerates the backend not being ready yet (it warns and
    # retries), so no healthcheck gate is needed. For a 5,000-object load test
    # instead, add flags after the config (flags win over the file):
    #   ["--config", "/app/simulator.toml", "--generate", "5000", "--duration", "0"]
    volumes:
      - ./config/${OLV_INPUT:-olv1}/simulator.toml:/app/simulator.toml:ro
    security_opt:
      - label=disable
    command: ["--config", "/app/simulator.toml"]
    networks:
      - olv-net

networks:
  olv-net:
    driver: bridge
