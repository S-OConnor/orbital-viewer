# compose.yaml — run backend + frontend + simulator together.
#
# Usage (from the repo root):
#   podman compose -f containers/compose.yaml up --build
#   docker compose -f containers/compose.yaml up --build
#   # or the wrapper, which also waits for readiness and tears down on Ctrl-C:
#   scripts/run_all.sh
#
# Then open http://localhost:8000/ in a browser. The frontend's default
# Settings -> WS host/port already points at localhost:8765, which is
# published by the backend service below, so no configuration is needed.
#
# Published host ports can be overridden without touching the containers'
# internal ports (which stay 8765/47000/80) via environment variables:
#   OLV_WS_PORT (default 8765), OLV_UDP_PORT (default 47000),
#   OLV_HTTP_PORT (default 8000). scripts/run_all.sh sets these from its
#   --ws-port / --udp-port / --http-port flags.
#
# Build contexts are the repo root (".."), since both Containerfiles COPY
# repo-relative paths (the whole tree for Containerfile.cpp, frontend/ for
# Containerfile.frontend).
#
# Networking: compose creates an internal network for these services by
# default; the simulator reaches the backend by its service name ("backend")
# on that internal network — no host networking or port mapping is needed
# between simulator and backend, only backend<->host and frontend<->host are
# published below.
#
# Air-gap: all three images must be built (or already present) locally first
# — see containers/Containerfile.cpp and containers/Containerfile.frontend
# for their base-image/apt-mirror notes. No service reaches the internet at
# runtime.

services:
  backend:
    build:
      context: ..
      dockerfile: containers/Containerfile.cpp
      target: backend
    ports:
      - "${OLV_WS_PORT:-8765}:8765"
      - "${OLV_UDP_PORT:-47000}:47000/udp"
    networks:
      - olv-net
    # To configure via TOML instead of the CMD flags, mount a config file and
    # point the entrypoint at it (same pattern works for the simulator):
    #   volumes:
    #     - ../config/backend.toml:/app/backend.toml:ro,Z
    #   command: ["--config", "/app/backend.toml"]

  frontend:
    build:
      context: ..
      dockerfile: containers/Containerfile.frontend
    ports:
      - "${OLV_HTTP_PORT:-8000}:80"
    networks:
      - olv-net

  simulator:
    build:
      context: ..
      dockerfile: containers/Containerfile.cpp
      target: simulator
    depends_on:
      - backend
    # Replay the bundled example mission on loop (the CSV is baked into the
    # image at /app/data). The simulator tolerates the backend not being ready
    # yet (it warns and retries), so no healthcheck gate is needed. For a
    # 5,000-object load test instead, swap this for:
    #   ["--generate", "5000", "--dest", "backend", "--port", "47000", "--rate", "1", "--duration", "0"]
    command: ["--csv", "/app/data/example_mission.csv", "--loop", "--rate", "1", "--dest", "backend", "--port", "47000"]
    networks:
      - olv-net

networks:
  olv-net:
    driver: bridge
