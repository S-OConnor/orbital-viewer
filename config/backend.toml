# Orbital LOS Viewer backend configuration — pass with:
#   olv_backend --config config/backend.toml
#
# Schema is strict: unknown keys, wrong value types, and out-of-range values
# are all rejected (see backend/src/config.hpp for the normative schema and
# backend/include/olv/toml.hpp for the supported TOML subset).
#
# Precedence (lowest to highest): built-in defaults < this file (applied via
# --config) < explicit command-line flags — regardless of where --config
# appears relative to the other flags on the command line.
#
# Every value below is the built-in default, so running with this file
# unmodified is a no-op. Edit values below to override, or delete lines to
# fall back to the default for that field.

[network]
# UDP listen address for incoming state packets (dotted IPv4/IPv6 literal).
udp_bind = "0.0.0.0"
# UDP listen port. Range: 1-65535.
udp_port = 47000
# WebSocket listen address for viewer clients (dotted IPv4/IPv6 literal).
ws_bind = "0.0.0.0"
# WebSocket listen port. Range: 1-65535.
ws_port = 8765

[broadcast]
# WebSocket broadcast rate in Hz. Range: greater than 0, up to and
# including 60. May be written as an integer (e.g. 2) or a float (e.g. 2.5).
hz = 1.0

[state]
# Object expiry window, in seconds. Range: 1-3600.
expiry_seconds = 15

[input]
# Intake strategy selected at boot. "olv1" = the first-party OLV1 UDP binary
# protocol (docs/PROTOCOL_UDP.md). "dis" = IEEE 1278.1 DIS Entity State PDUs
# (docs/PROTOCOL_DIS.md).
mode = "olv1"

# The dis_* keys below are consulted only when mode = "dis"; they are still
# schema-checked whenever present. (The first-party TOML subset has single-level
# tables only, so these are flat dis_* keys rather than a nested [input.dis]
# table.)
#
# UDP listen address/port for incoming DIS Entity State PDUs. The default port
# is distinct from OLV1's 47000 so both modes' defaults can coexist on a host.
dis_bind = "0.0.0.0"
dis_port = 47001
# Optional exercise filter, 0-255. Commented out = accept all exercise IDs; a
# PDU whose DIS exerciseID differs is ignored (counted as received only).
# dis_exercise_id = 1
# The one DIS entity promoted to the satellite, as site:application:entity
# (three decimal 0-65535 values). Required when mode = "dis"; every other entity
# becomes a tracked object. Uncomment and set when running DIS mode:
# dis_satellite_entity_id = "1:1:1"

[logging]
# Log file path (must be non-empty).
file = "olv_backend.log"
# Log level: debug|info|warn|error.
level = "info"
# Mirror log lines at level >= info to stderr in addition to the log file.
stderr = true
