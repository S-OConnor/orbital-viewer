# Orbital LOS Viewer simulator configuration — pass with:
#   olv_sim --config config/simulator.toml
#
# Precedence (lowest to highest): built-in defaults < this file < explicit
# command-line flags — a flag always wins over the same setting here,
# regardless of where --config appears among the other flags. Schema is
# strict: unknown keys, wrong types, and out-of-range values are rejected
# with a descriptive error naming the offending key (see
# tools/simulator/src/sim_config.hpp for the full contract).
#
# This file's defaults are runnable as-is (csv mode, looping the committed
# example mission) from the repository root:
#   olv_sim --config config/simulator.toml

[target]
host = "127.0.0.1"   # destination address for UDP OLV1 packets
port = 47000          # destination UDP port, [1,65535]

[source]
# Data source: exactly one of "csv" or "generate". A source mode must be
# set here or via --csv/--generate — the simulator refuses to start without
# one.
mode = "csv"

# ---- csv mode -------------------------------------------------------------
csv_path = "tools/simulator/data/example_mission.csv"  # path is resolved relative
                                                  # to the current working
                                                  # directory when olv_sim runs
loop = true  # wrap to the first frame and keep going once the file ends

# ---- generate mode (uncomment to switch: set mode = "generate" above and
#      comment out csv_path/loop instead) -----------------------------------
# generate_count = 5000       # synthetic tracked objects, [1,5000]
# duration_seconds = 120      # run this many seconds; 0 = run forever
# seed = 1                    # RNG seed, [0,4294967295] (deterministic scenario)

[send]
rate_hz = 1.0  # cycles/second, (0,50]
chunk = 128    # max objects per UDP packet, [1,128] (olv1 protocol only)

# Wire protocol: "olv1" (default, docs/PROTOCOL_UDP.md), "dis" (IEEE 1278.1
# DIS Entity State PDUs, one entity per datagram — pair with
# `olv_backend --input-mode dis`), or "olv2" (docs/PROTOCOL_OLV2.md,
# per-track batched updates — pair with `olv_backend --input-mode olv2`).
# When "dis" is selected and no port is set here or via --port, the
# destination port defaults to 47001 (the backend's DIS default) instead of
# 47000; for "olv2" it defaults to 47002.
protocol = "olv1"

# ---- dis protocol only (still schema-checked whenever present) -------------
# dis_exercise_id = 1              # PDU header exerciseID, [0,255]
# dis_site = 1                     # EntityID site stamped on every object
# dis_satellite_entity_id = "1:1:1"  # satellite EntityID, "site:application:entity"
#                                    # — must match the backend's
#                                    # [input] dis_satellite_entity_id

# ---- olv2 protocol only (still schema-checked whenever present) ------------
# olv2_points = 10  # points per datagram, [1,25]. Batch period (points ÷
#                    # rate_hz) should stay below the backend's
#                    # [state] expiry_seconds (default 15 s), or tracks blink
#                    # out between batches; olv_sim warns above 10 s.

[output]
quiet = false  # true suppresses the per-cycle status line
